name: Deploy

# main にマージされたとき、または Actions 画面から手動で実行したときに Cloudflare へデプロイする。
# 必要なリポジトリ Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# 任意: COLLECTOR_ADMIN_TOKEN(収集 Worker を手動実行するためのトークン)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COLLECTOR_ADMIN_TOKEN: ${{ secrets.COLLECTOR_ADMIN_TOKEN }}
    steps:
      - name: Secrets の確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # D1 データベースがなければ作成し、その ID を設定ファイルに書き込む
      - name: D1 データベースの準備
        run: |
          find_id() {
            npx wrangler d1 list --json | jq -r '.[] | select(.name == "kokkai-watch") | (.uuid // .id)' | head -n1
          }
          DB_ID="$(find_id)"
          if [ -z "$DB_ID" ]; then
            echo "D1 データベース kokkai-watch を作成します"
            npx wrangler d1 create kokkai-watch
            DB_ID="$(find_id)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 データベースの ID を取得できませんでした"
            exit 1
          fi
          echo "D1 database id: $DB_ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" workers/app/wrangler.jsonc workers/collector/wrangler.jsonc

      - name: マイグレーションの適用
        run: npx wrangler d1 migrations apply kokkai-watch --remote -c workers/app/wrangler.jsonc

      - name: 収集 Worker のデプロイ
        working-directory: workers/collector
        run: npx wrangler deploy

      - name: 収集 Worker の手動実行トークンを設定
        if: ${{ env.COLLECTOR_ADMIN_TOKEN != '' }}
        working-directory: workers/collector
        run: echo "$COLLECTOR_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: アプリ Worker のデプロイ
        working-directory: workers/app
        run: npx wrangler deploy
